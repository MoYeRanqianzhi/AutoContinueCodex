# ACX Release — 构建 + npm 发布
# 触发：推送 acx-v*.*.* tag
# 构建步骤复用上游 openai/codex 的基础设施（V8 预编译件等）
name: acx-release

on:
  push:
    tags:
      - "acx-v*.*.*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tag-check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate tag matches Cargo.toml version
        id: extract
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#acx-v}"
          cargo_ver="$(grep -m1 '^version' codex-rs/Cargo.toml \
                        | sed -E 's/version *= *"([^"]+)".*/\1/')"
          if [[ "${tag_ver}" != "${cargo_ver}" ]]; then
            echo "Tag ${tag_ver} != Cargo.toml ${cargo_ver}"
            exit 1
          fi
          echo "version=${tag_ver}" >> "$GITHUB_OUTPUT"

  build:
    needs: tag-check
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          # macos-13 (Intel) 免费 runner 极度稀缺，暂时跳过
          # - runner: macos-13
          #   target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libcap-dev

      - name: Install UBSan runtime (musl)
        if: contains(matrix.target, 'linux-musl')
        shell: bash
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libubsan1

      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      # --- musl-specific setup (Zig cross-compile + V8 prebuilt) ---
      - if: contains(matrix.target, 'linux-musl')
        name: Use hermetic Cargo home (musl)
        shell: bash
        run: |
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - if: contains(matrix.target, 'linux-musl')
        name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.0

      - if: contains(matrix.target, 'linux-musl')
        name: Install musl build tools
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - if: contains(matrix.target, 'linux-musl')
        name: Configure rustc UBSan wrapper (musl host)
        shell: bash
        run: |
          set -euo pipefail
          ubsan=""
          if command -v ldconfig >/dev/null 2>&1; then
            ubsan="$(ldconfig -p | grep -m1 'libubsan\.so\.1' | sed -E 's/.*=> (.*)$/\1/')"
          fi
          wrapper_root="${RUNNER_TEMP:-/tmp}"
          wrapper="${wrapper_root}/rustc-ubsan-wrapper"
          cat > "${wrapper}" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${ubsan}" ]]; then
            export LD_PRELOAD="${ubsan}\${LD_PRELOAD:+:\${LD_PRELOAD}}"
          fi
          exec "\$1" "\${@:2}"
          EOF
          chmod +x "${wrapper}"
          echo "RUSTC_WRAPPER=${wrapper}" >> "$GITHUB_ENV"
          echo "RUSTC_WORKSPACE_WRAPPER=" >> "$GITHUB_ENV"

      - if: contains(matrix.target, 'linux-musl')
        name: Clear sanitizer flags (musl)
        shell: bash
        run: |
          set -euo pipefail
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_var="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          echo "${target_var//-/_}=1" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_ENCODED_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "RUSTDOCFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=" >> "$GITHUB_ENV"

          sanitize_flags() {
            local input="$1"
            input="${input//-fsanitize=undefined/}"
            input="${input//-fno-sanitize-recover=undefined/}"
            input="${input//-fno-sanitize-trap=undefined/}"
            echo "$input"
          }

          cflags="$(sanitize_flags "${CFLAGS-}")"
          cxxflags="$(sanitize_flags "${CXXFLAGS-}")"
          echo "CFLAGS=${cflags}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${cxxflags}" >> "$GITHUB_ENV"

      - if: contains(matrix.target, 'linux-musl')
        name: Configure musl rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8-musl
        with:
          target: ${{ matrix.target }}

      # --- Build ---
      - name: Cargo build
        shell: bash
        run: |
          cargo build --target ${{ matrix.target }} --release --bin codex

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          src="target/${{ matrix.target }}/release/codex${ext}"
          dest="${GITHUB_WORKSPACE}/staged/${{ matrix.target }}/codex/"
          mkdir -p "${dest}"
          # [ACX] 重命名为 acx，不修改上游 Cargo.toml
          cp "${src}" "${dest}acx${ext}"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: binaries-${{ matrix.target }}
          path: staged/${{ matrix.target }}

  package-npm:
    needs: [tag-check, build]
    name: Package and publish npm
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@moyeranqianzhi"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Stage npm packages
        env:
          VERSION: ${{ needs.tag-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # [ACX] 直接调用 build_npm_package.py（不使用 stage_npm_packages.py，
          # 因为后者依赖 gh CLI 下载 artifacts，而我们已通过 actions/download-artifact 获取）

          # 整理 artifacts 目录结构
          mkdir -p build-artifacts
          for dir in artifacts/binaries-*; do
            target=$(basename "$dir" | sed 's/binaries-//')
            mkdir -p "build-artifacts/${target}"
            cp -r "$dir"/* "build-artifacts/${target}/"
          done

          mkdir -p dist/npm

          # 打包主 codex 包（无原生组件，只含 JS 入口）
          python3 codex-cli/scripts/build_npm_package.py \
            --package codex \
            --release-version "$VERSION" \
            --pack-output "dist/npm/acx-npm-${VERSION}.tgz"

          # 打包各平台包（含原生二进制）
          for dir in build-artifacts/*; do
            target=$(basename "$dir")
            case "$target" in
              x86_64-unknown-linux-musl)   pkg="codex-linux-x64" ;;
              aarch64-unknown-linux-musl)  pkg="codex-linux-arm64" ;;
              aarch64-apple-darwin)        pkg="codex-darwin-arm64" ;;
              x86_64-apple-darwin)         pkg="codex-darwin-x64" ;;
              x86_64-pc-windows-msvc)      pkg="codex-win32-x64" ;;
              aarch64-pc-windows-msvc)     pkg="codex-win32-arm64" ;;
              *) echo "Unknown target: $target, skipping"; continue ;;
            esac
            python3 codex-cli/scripts/build_npm_package.py \
              --package "$pkg" \
              --release-version "$VERSION" \
              --vendor-src build-artifacts \
              --pack-output "dist/npm/acx-npm-${pkg#codex-}-${VERSION}.tgz"
          done

          echo "Packaged tarballs:"
          ls -la dist/npm/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for tarball in dist/npm/*.tgz; do
            echo "Publishing $(basename "$tarball")..."
            publish_output="$(npm publish "${tarball}" --access public 2>&1)" || {
              if grep -qiE "previously published|cannot publish over|version already exists" <<< "${publish_output}"; then
                echo "Already published, skipping"
              else
                echo "${publish_output}"
                exit 1
              fi
            }
            echo "${publish_output}"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ACX ${{ needs.tag-check.outputs.version }}
          generate_release_notes: true
